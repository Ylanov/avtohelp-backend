version: '3'
services:
  worker:
    image: registry.gitlab.com/agencypro/roadhelpbackend:2021.10.20.14.06
    command: make celery
    environment:
      - SETTINGS_CONFIGURATION=local
      - DB_NAME=postgres
      - DB_USERNAME=postgres
      - DB_HOSTNAME=db
      - DB_PORT=5432
      - DB_PASSWORD=postgres
  road_helper:
    image: registry.gitlab.com/agencypro/roadhelpbackend:2021.10.20.14.06
    command: make start && make make run-gunicorn
    environment:
      - DB_NAME=postgres
      - DB_USERNAME=postgres
      - DB_HOSTNAME=db
      - DB_PORT=5432
      - DB_PASSWORD=postgres
    ports:
      - "8000:8000"
