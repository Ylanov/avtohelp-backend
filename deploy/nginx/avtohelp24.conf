# nginx config for avtohelp24.ru
# - :80 redirects everything to https
# - :443 serves the Django API via gunicorn (WSGI) and the WebSocket chat
#   stream via daphne (ASGI) under a dedicated location.
# - /media/ and /static/ served directly from mounted volumes.
#
# Deployed via docker-compose.prod.yml.

upstream roadhelp_api {
    server api:8000;
}

upstream roadhelp_ws {
    server ws:8001;
}

# -------------------------------------------------------------------- HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name avtohelp24.ru www.avtohelp24.ru;

    # Let's Encrypt webroot challenge (certbot writes here)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://avtohelp24.ru$request_uri;
    }
}

# -------------------------------------------------------------------- HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name avtohelp24.ru www.avtohelp24.ru;

    ssl_certificate     /etc/letsencrypt/live/avtohelp24.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avtohelp24.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: match the Django prod setting (30 days).
    add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Accept uploads up to 100MB (matches DATA_UPLOAD_MAX_MEMORY_SIZE).
    client_max_body_size 100M;

    # ----------------------------------------------------------- static / media
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    # ----------------------------------------------------------- WebSocket chat
    # Chat WS upgrades go to daphne; everything else to gunicorn.
    location = /chat/stream {
        proxy_pass         http://roadhelp_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ----------------------------------------------------------- HTTP API
    location / {
        proxy_pass         http://roadhelp_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
