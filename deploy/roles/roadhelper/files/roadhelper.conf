server {
    listen  443 ssl;
    server_name     avto-dobro.ru www.avto-dobro.ru;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/avto-dobro.ru/avto_chain.crt;

    ssl_certificate_key /etc/letsencrypt/live/avto-dobro.ru/privkey2.key;
    ssl_session_timeout 5m;
    ssl_protocols SSLv3 TLSv1;
    ssl_ciphers ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv3:+EXP;
    ssl_prefer_server_ciphers on;
    keepalive_timeout 10;
    gzip on;
    gzip_http_version 1.1;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    large_client_header_buffers 8 32k;

    client_max_body_size 200m;

    location / {
        proxy_pass      http://localhost:8007;

        proxy_http_version 1.1;

        proxy_buffers 8 32k;
        proxy_buffer_size 64k;
        proxy_connect_timeout 43200000;
        proxy_read_timeout 43200000;
        proxy_send_timeout 43200000;
        client_max_body_size 200m;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-Start $msec;
    }
    location /static/ {
        root /home/HOSTING/roadhelper/project/media;
        access_log off;
        log_not_found off;
    }
    location /media/ {
        root /home/HOSTING/roadhelper/project/media;
        access_log off;
        log_not_found off;
    }
    location /robots.txt {
        root /home/HOSTING/roadhelper/project/media;
        access_log off;
        log_not_found off;
    }
    location /app-ads.txt {
        root /home/HOSTING/roadhelper/project/media;
        access_log off;
        log_not_found off;
    }

    access_log      /var/log/nginx/roadhelper.log;
    error_log       /var/log/nginx/roadhelper.error;

    root /home/httpd;
}


server {
    listen  80;
    server_name     avto-dobro.ru www.avto-dobro.ru;
    charset utf-8;

    rewrite ^(.*)$  https://avto-dobro.ru$1       permanent;

    root /home/httpd;
}
