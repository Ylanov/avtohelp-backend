[tool.poetry]
name = "roadhelpbackend"
version = "1.0.0"
description = "RoadHelp backend — взаимопомощь водителей на дороге"
authors = ["Aleks"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

# Django core
Django = "~5.2"
djangorestframework = "~3.15"
djangorestframework-gis = "~1.1"
django-filter = "~25.1"
django-cors-headers = "~4.7"
django-ratelimit = "~4.1"
django-redis = "~5.4"
django-environ = "~0.12"
django-phonenumber-field = {version = "~8.1", extras = ["phonenumbers"]}
django-solo = "~2.4"
django-multiselectfield = "~0.1.13"

# WebSockets (chat)
channels = {version = "~4.2", extras = ["daphne"]}
channels-redis = "~4.2"

# Database driver
"psycopg[binary]" = "~3.2"

# Task queue
celery = {version = "~5.4", extras = ["redis"]}
django-celery-beat = "~2.8"
redis = "~5.2"

# Push notifications — fcm-django 2.x uses firebase-admin SDK (не legacy server key)
fcm-django = "~2.2"
firebase-admin = "~6.6"

# Media / images
Pillow = "~11.1"
easy-thumbnails = "~2.10"

# OpenAPI docs (replacement for abandoned django-rest-swagger)
drf-spectacular = "~0.28"

# HTTP client for SMS/OTP integrations
requests = "~2.32"

# Servers
gunicorn = "~23.0"

# Observability
sentry-sdk = {version = "~2.20", extras = ["django", "celery"]}

[tool.poetry.group.dev.dependencies]
pytest = "~8.3"
pytest-django = "~4.9"
pytest-cov = "~6.0"
pytest-mock = "~3.14"
pytest-asyncio = "~0.25"
factory-boy = "~3.3"
freezegun = "~1.5"
responses = "~0.25"
ruff = "~0.9"
mypy = "~1.14"
django-stubs = "~5.1"
djangorestframework-stubs = "~3.15"
ipython = "~8.31"
ipdb = "~0.13"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "roadhelpbackend.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "contract: API contract tests that must stay green during any refactor",
    "slow: slow tests (network, docker)",
]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "roadhelpbackend.settings.dev"
