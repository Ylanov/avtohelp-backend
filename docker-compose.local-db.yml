version: '3'
services:
  db:
    image: mdillon/postgis:9.5
    hostname: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./database:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
   image: redis:2.8.23
   ports:
      - "6379:6379"
